name: Build macOS Desktop

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Wails app (darwin/universal)
        run: |
          GOCACHE=$RUNNER_TEMP/go-cache go run github.com/wailsapp/wails/v2/cmd/wails@v2.11.0 build -tags wails -platform darwin/universal -clean

      - name: Pack artifact
        run: |
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent desktop-nardy-engine.app desktop-nardy-engine-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-nardy-engine-macos
          path: build/bin/desktop-nardy-engine-macos.zip
