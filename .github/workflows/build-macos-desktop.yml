name: Build macOS Desktop

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build app bundle and zip
        run: |
          GOCACHE=$RUNNER_TEMP/go-cache ./scripts/build-macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-nardy-engine-macos
          path: build/bin/desktop-nardy-engine-macos.zip
